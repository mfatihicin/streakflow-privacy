<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreakFlow Help Center</title>
  <style>
    :root {
      --bg: #ffffff; --text: #1a1a1a; --text-muted: #666; 
      --primary: #4CAF50; --card: #f5f5f7; --border: #e5e5ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000; --text: #f5f5f7; --text-muted: #8e8e93; 
        --primary: #32d74b; --card: #1c1c1e; --border: #38383a;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg); color: var(--text);
      max-width: 600px; margin: 0 auto; padding: 60px 24px; line-height: 1.6;
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 28px; margin-bottom: 8px; font-weight: 700; }
    p { color: var(--text-muted); font-size: 16px; margin-bottom: 32px; }
    .card {
      background-color: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; margin-bottom: 16px;
      text-align: left; display: flex; align-items: center; justify-content: space-between;
      text-decoration: none; color: var(--text); transition: transform 0.2s;
    }
    .card:active { transform: scale(0.98); }
    .card-content h3 { margin: 0 0 4px 0; font-size: 18px; }
    .card-content span { color: var(--text-muted); font-size: 14px; }
    .arrow { color: var(--text-muted); font-weight: bold; }
    .footer { margin-top: 48px; font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="icon">💬</div>
  <h1>How can we help you?</h1>
  <p>Choose an option below to find answers or get in touch with the StreakFlow team.</p>

  <a href="faq.html" class="card">
    <div class="card-content">
      <h3>📚 Frequently Asked Questions</h3>
      <span>Find quick answers to common issues</span>
    </div>
    <div class="arrow">➔</div>
  </a>

  <a href="mailto:mfatihicin@gmail.com?subject=StreakFlow%20Support" class="card">
    <div class="card-content">
      <h3>✉️ Contact Support</h3>
      <span>Email us directly at mfatihicin@gmail.com</span>
    </div>
    <div class="arrow">➔</div>
  </a>

  <div class="footer">
    &copy; 2026 StreakFlow. All rights reserved.
  </div>

</body>
</html>
